trigger: none
pr: none


pool:
  vmImage: 'ubuntu-24.04'

# Define global pipeline variables and Android SDK paths required by Gradle
variables:
  - group: development
  - name: ANDROID_HOME
    value: /usr/local/lib/android/sdk
  - name: ANDROID_SDK_ROOT
    value: /usr/local/lib/android/sdk

steps:

  - checkout: self

  # Remove heavy pre-installed toolchains (dotnet, ghc, boost, NDKs) to reclaim ~30GB of disk space
  - script: |
      sudo rm -rf /usr/share/dotnet
      sudo rm -rf /opt/ghc
      sudo rm -rf /usr/local/share/boost
      sudo rm -rf /usr/local/lib/android/sdk/ndk-bundle
      sudo rm -rf /usr/local/lib/android/sdk/ndk
    displayName: Free up runner disk space

  # Download and set up Node.js version 22.13.0 on the runner
  - task: UseNode@1
    inputs:
      version: '22.13.0'

  # Perform a clean, reproducible installation of project dependencies using package-lock.json
  - script: npm ci
    displayName: Install dependencies

  # Inject runtime secrets from the variable group into a root .env file
  - script: |
      echo "API_BASE_URL=$(API_BASE_URL)" > .env
      cat .env
    displayName: Create .env

  # Build release APK for arm64-v8a only
  # (Gradle bundles JS + compiles Hermes bytecode itself; no manual bundle step)
  - script: |
      cd android
      ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      cp app/build/outputs/apk/release/app-release.apk \
         app/build/outputs/apk/release/tghb-release-arm64.apk
    displayName: Build Android Release APK (arm64-v8a)

  # Publish the APK as a pipeline artifact
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: 'android/app/build/outputs/apk/release/tghb-release-arm64.apk'
      artifact: 'tghb-release-arm64-apk'
    displayName: Publish APK