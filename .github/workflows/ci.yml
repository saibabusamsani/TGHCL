trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-24.04'

steps:
  - checkout: self
    displayName: Checkout

  - task: UseNode@1
    displayName: Setup Node.js
    inputs:
      version: '22.13.0'

  - script: npm ci
    displayName: Install dependencies

  - script: npx tsc --noEmit
    displayName: TypeScript check

  - script: npm run lint
    displayName: Lint

  - script: npm run test:ci
    displayName: Tests