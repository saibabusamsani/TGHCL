apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

react {
    autolinkLibrariesWithApp()
}

def hasCiSigning = System.getenv("KEYSTORE_FILE")?.trim() as boolean
def isProductionBuild = hasCiSigning || project.hasProperty("android.injected.signing.store.file")

def resolvedVersionCode = (project.findProperty('VERSION_CODE') ?: "1").toString().toInteger()
def resolvedVersionName = (project.findProperty('VERSION_NAME') ?: "1.0.0").toString()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.leadwinner.gpms_tghb"
    defaultConfig {
        applicationId "com.leadwinner.gpms_tghb"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName

        resourceConfigurations += ["en", "hi", "te"]
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    signingConfigs {
        ciRelease {
            if (hasCiSigning) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasCiSigning ? signingConfigs.ciRelease : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            ndk {
                abiFilters.addAll(isProductionBuild ? ["arm64-v8a", "armeabi-v7a"] : ["arm64-v8a"])
            }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}